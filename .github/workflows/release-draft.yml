# Release Draft 자동 생성(D-044).
# Actions 탭 → 'Release Draft' → Run workflow → 버전 입력.
# 전체 검사(pnpm check)를 통과해야만 Draft pre-release를 만든다. 게시(Publish)는 사용자가 직접 한다(AGENTS.md).
# Draft는 게시 전까지 태그를 만들지 않는다. 같은 태그·Release가 이미 있으면 덮어쓰지 않고 멈춘다.
name: Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: '앱 버전(package.json과 같아야 함, 예: 2.5.0-alpha.1)'
        required: true
        type: string
      title:
        description: 'Release 제목(비우면 "v<버전>")'
        required: false
        type: string
      prerelease:
        description: '시험판(pre-release)으로 표시'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 입력·버전·중복 확인
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::버전 형식 오류: $VERSION"; exit 1
          fi
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::package.json 버전($PKG)과 입력 버전($VERSION)이 다릅니다. 버전 PR을 먼저 병합하세요."; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::태그 v$VERSION 이 이미 있습니다. 기존 태그·Release는 바꾸지 않습니다."; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION 이(가) 이미 있습니다(Draft 포함). 덮어쓰지 않습니다."; exit 1
          fi

      # pnpm을 먼저 설치한 뒤 Node 캐시를 설정한다(CI와 같은 순서).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm exec playwright install --with-deps chromium

      - name: 전체 검사
        run: pnpm check

      - name: 산출물·해시 확인
        id: art
        run: |
          set -euo pipefail
          FILE=$(node -p "require('./dist/build-metadata.json').file")
          META_SHA=$(node -p "require('./dist/build-metadata.json').sha256")
          REAL_SHA=$(sha256sum "dist/$FILE" | cut -d' ' -f1)
          if [ "$META_SHA" != "$REAL_SHA" ]; then echo "::error::해시 불일치"; exit 1; fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "sha=$REAL_SHA" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c %s "dist/$FILE")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 본문 준비
        env:
          VERSION: ${{ inputs.version }}
          FILE: ${{ steps.art.outputs.file }}
          SHA: ${{ steps.art.outputs.sha }}
          BYTES: ${{ steps.art.outputs.bytes }}
          COMMIT: ${{ steps.art.outputs.commit }}
        run: |
          set -euo pipefail
          NOTES="docs/releases/v$VERSION.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" notes.md
          else
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
            RANGE=${PREV:+$PREV..HEAD}
            {
              echo "## Warehouse Layout Designer v$VERSION"
              echo
              echo "### 포함된 변경${PREV:+ ($PREV 이후)}"
              git log ${RANGE:-HEAD} --merges --first-parent --pretty='- %s' | grep -v '^- Merge branch' || echo "- (병합 기록 없음)"
            } > notes.md
          fi
          {
            echo
            echo "---"
            echo "자동 생성 정보(Release Draft 워크플로): main ${COMMIT:0:7} · \`$FILE\` · $BYTES bytes · sha256 \`$SHA\` · \`pnpm check\` PASS(ubuntu-latest)."
          } >> notes.md

      - name: Draft Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          PRE: ${{ inputs.prerelease }}
          FILE: ${{ steps.art.outputs.file }}
          COMMIT: ${{ steps.art.outputs.commit }}
        run: |
          set -euo pipefail
          ARGS=(--draft --target "$COMMIT" --title "${TITLE:-v$VERSION}" --notes-file notes.md)
          if [ "$PRE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "v$VERSION" "dist/$FILE" "${ARGS[@]}"
          echo "### Draft 생성: v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Releases에서 Draft 내용을 확인한 뒤 Publish 하세요. (본문에는 Draft 안내 문구를 넣지 않습니다)" >> "$GITHUB_STEP_SUMMARY"
